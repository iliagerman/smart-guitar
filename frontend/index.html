<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a0a" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap"
    rel="stylesheet" />
  <title>Smart Guitar</title>
</head>

<body class="bg-charcoal-950 text-smoke-100 font-sans antialiased">
  <div id="root">
    <!-- Boot splash: painted before the JS bundle and CSS load, then replaced
         when React mounts into #root. Inline styles because Tailwind hasn't
         loaded yet. The build stamp (__BUILD_STAMP__) is injected at build time so
         you can confirm which deployment is actually running — a stale PWA cache
         shows an old stamp. -->
    <div id="boot-splash"
      style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#0a0a0a;color:#e5e5e5;font-family:system-ui,-apple-system,sans-serif">
      <div style="font-size:20px;font-weight:700;letter-spacing:0.02em">Smart Guitar</div>
      <div
        style="width:22px;height:22px;border:2px solid #3f3f46;border-top-color:#facc15;border-radius:9999px;animation:boot-spin 0.8s linear infinite">
      </div>
      <div style="font-size:11px;color:#71717a;font-family:ui-monospace,SFMono-Regular,Menlo,monospace">__BUILD_STAMP__</div>
    </div>
  </div>
  <style>
    @keyframes boot-spin {
      to {
        transform: rotate(360deg)
      }
    }
  </style>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
